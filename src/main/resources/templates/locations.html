<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory — Locations</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px solid #ddd; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <h1>Locations</h1>
    <nav><a href="/items">Items</a></nav>
  </header>
  <form method="post" action="/locations/create" style="margin-bottom: 1.5rem;">
    <input type="text" name="name" placeholder="Name" required>
    <input type="number" name="latitude" placeholder="Latitude" step="any" min="-90" max="90">
    <input type="number" name="longitude" placeholder="Longitude" step="any" min="-180" max="180">
    <button type="submit">Add location</button>
  </form>
  {#if locations.empty}
  <p>No locations yet.</p>
  {#else}
  <table>
    <thead><tr><th>Name</th><th>Coordinates</th><th></th></tr></thead>
    <tbody>
      {#for l in locations}
      <tr>
        <td>{l.name}</td>
        <td>{#if l.latitude}{l.latitude}, {l.longitude}{/if}</td>
        <td>
          <form class="inline" method="post" action="/locations/{l.id}/delete"
                onsubmit="return confirm('Delete {l.name}? Fails if items still live there.');">
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {/for}
    </tbody>
  </table>
  {/if}
</body>
</html>
