<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory — Tokens</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px solid #ddd; }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <header>
    <h1>Tokens</h1>
    <nav><a href="/admin">Users</a> <a href="/items">Items</a></nav>
  </header>
  {#if tokens.empty}
  <p>No tokens issued to this user.</p>
  {#else}
  <table>
    <thead><tr><th>Token</th><th>Issued</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {#for t in tokens}
      <tr>
        <td><code>{t.token}</code></td>
        <td>{t.issuedAt}</td>
        <td>{#if t.revoked}revoked{#else}active{/if}</td>
        <td>
          {#if !t.revoked}
          <form method="post" action="/admin/tokens/revoke">
            <input type="hidden" name="token" value="{t.token}">
            <input type="hidden" name="userId" value="{userId}">
            <button type="submit">Revoke</button>
          </form>
          {/if}
        </td>
      </tr>
      {/for}
    </tbody>
  </table>
  {/if}
</body>
</html>
