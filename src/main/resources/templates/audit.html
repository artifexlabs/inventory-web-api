<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory — Audit trail</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px solid #ddd; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
  </style>
</head>
<body>
  <header>
    <h1>Audit trail</h1>
    <nav><a href="/items">Items</a> <a href="/admin">Admin</a></nav>
  </header>
  {#if events.empty}
  <p>Nothing recorded yet.</p>
  {#else}
  <table>
    <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Target</th></tr></thead>
    <tbody>
      {#for e in events}
      <tr>
        <td>{e.timestamp}</td>
        <td>{e.principal}</td>
        <td>{e.action}</td>
        <td><a href="/items/{e.targetId}">{e.targetId}</a></td>
      </tr>
      {/for}
    </tbody>
  </table>
  {/if}
</body>
</html>
