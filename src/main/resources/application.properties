quarkus.application.name=inventory-web-api
quarkus.http.port=8081

# The single HTTP tier (post-consolidation): domain REST surface, OpenAPI,
# and the backing stores all live here. See VERTICLES.md.

# Storage backend: memory (default) or pg. In pg mode configure
# quarkus.datasource.reactive.url (and credentials) or enable Dev Services.
inventory.storage=memory
inventory.principal=inventory-web-api

# Static token seeded into the in-memory TokenService (memory mode only);
# pg mode issues tokens exclusively via /api/v1/auth/login.
inventory.api.token=dev-token

# Admin user ensured at startup (idempotent). Change these outside dev.
inventory.admin.email=admin@example.com
inventory.admin.password=change-me

# OIDC identity exchange: disabled (404) until a shared secret is set. The
# webapp presents this secret with a provider-verified identity to obtain a token.
# inventory.oidc.exchange-secret=<shared-secret>
# Provisioning: invited (email must already exist) or auto (create on first login).
inventory.oidc.provision=invited

# Dev Services may start a Postgres container in dev/test when a datasource
# is demanded (pg mode); memory mode never touches it. The datasource health
# probe stays off so memory mode reports UP without a database.
quarkus.devservices.enabled=true
quarkus.datasource.health.enabled=false
