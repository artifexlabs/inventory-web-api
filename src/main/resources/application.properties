quarkus.application.name=inventory-web-api
quarkus.http.port=8081

# The authenticated HTTP gateway: REST surface + OpenAPI + authentication
# live here; the domain work crosses the Vert.x event-bus fabric as
# envelopes answered by the workers (inventory-server in deployment).

# Where the workers run: embedded (default — the gateway deploys the same
# worker set in-process on its local bus; single-process dev/test) or remote
# (envelopes travel the clustered bus to inventory-server).
inventory.bus.workers=embedded

# The shared bus-fabric token every envelope presents; workers refuse
# mismatches. Change it outside dev, identically on the server side.
inventory.bus.token=dev-bus-token
inventory.bus.timeout-ms=30000

# Storage backend for EMBEDDED mode only: memory (default) or pg. In pg mode
# configure quarkus.datasource.reactive.url (and credentials) or enable Dev
# Services. Remote mode owns no storage here at all.
inventory.storage=memory
inventory.principal=inventory-web-api

# Static token seeded into the in-memory TokenService (memory mode only);
# pg mode issues tokens exclusively via /api/v1/auth/login.
inventory.api.token=dev-token

# Admin user ensured at startup (idempotent). Change these outside dev.
inventory.admin.email=admin@example.com
inventory.admin.password=change-me

# OIDC identity exchange: disabled (404) until a shared secret is set. The
# webapp presents this secret with a provider-verified identity to obtain a token.
# inventory.oidc.exchange-secret=<shared-secret>
# Provisioning: invited (email must already exist) or auto (create on first login).
inventory.oidc.provision=invited

# Domain-fact publication (VERTICLES.md): none (default) | local | clustered.
# The audit table stays the log of record either way; the bus is only the
# live-notification plane, so leaving this off loses nothing but latency.
inventory.events.bus=none

# Dev Services may start a Postgres container in dev/test when a datasource
# is demanded (pg mode); memory mode never touches it. The datasource health
# probe stays off so memory mode reports UP without a database.
quarkus.devservices.enabled=true
quarkus.datasource.health.enabled=false
