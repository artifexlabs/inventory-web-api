quarkus.application.name=inventory-webapp
quarkus.http.port=8081

# Where inventory-server lives; the browser only ever talks to this webapp.
inventory.server.url=http://localhost:8080

# Items are rendered from JSON maps whose optional fields are simply absent;
# lenient rendering treats a missing key as empty instead of an error.
quarkus.qute.strict-rendering=false

# Sessions survive webapp restarts via this file ("none" disables persistence).
# Only session-id -> token pairs are stored; users are re-fetched every page.
inventory.webapp.session-file=${user.home}/.inventory-webapp-sessions.json
%test.inventory.webapp.session-file=none

# Google OIDC is off until real credentials exist. To enable, run with the
# "oidc" profile and supply the client id/secret and the exchange secret
# shared with inventory-server:
quarkus.profile=oidc
quarkus.oidc.client-id=REMOVED-CLIENT-ID
quarkus.oidc.credentials.secret=REMOVED-ROTATE-ME
inventory.oidc.exchange-secret=REMOVED-ROTATE-ME
quarkus.oidc.tenant-enabled=false
inventory.oidc.enabled=false

%oidc.quarkus.oidc.tenant-enabled=true
%oidc.quarkus.oidc.provider=google
%oidc.quarkus.oidc.application-type=web-app
%oidc.inventory.oidc.enabled=true
# Google must authenticate anyone reaching the OIDC entry point
%oidc.quarkus.http.auth.permission.oidc.paths=/oidc/login
%oidc.quarkus.http.auth.permission.oidc.policy=authenticated
